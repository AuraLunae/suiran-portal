<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f8f7f3">
<meta name="color-scheme" content="light dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ポータル">
<script>try{var t=localStorage.getItem('portal_theme');if(t==='dark'||(!t&&matchMedia('(prefers-color-scheme: dark)').matches))document.documentElement.dataset.theme='dark';}catch(e){}</script>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<title>テンシ ポータル</title>

<style>
:root{color-scheme:light;--bg:#f8f7f3;--text:#141414;--muted:#85837c;--line:#dddbd3;--ink:#141414;--on-ink:#f8f7f3;--good:#1c6b4d;--bad:#a8372c;--err:#a8372c;--tint:rgba(20,20,20,.04);--ease:cubic-bezier(.22,.68,.18,1)}
:root[data-theme="dark"]{color-scheme:dark;--bg:#0f0f0e;--text:#ecebe6;--muted:#8a8982;--line:#2a2a28;--ink:#ecebe6;--on-ink:#0f0f0e;--good:#86d0ae;--bad:#ee9186;--err:#ee9186;--tint:rgba(236,235,230,.06)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;line-height:1.85;font-size:16px;letter-spacing:.02em;font-feature-settings:"palt";padding-bottom:env(safe-area-inset-bottom);transition:background .4s,color .4s}
button{font:inherit;letter-spacing:inherit;color:inherit;cursor:pointer}button:disabled{opacity:.4;cursor:default}
input{font:inherit;letter-spacing:inherit;color:inherit}
:focus-visible{outline:1px solid var(--text);outline-offset:4px}
button,input{touch-action:manipulation}
[hidden]{display:none!important}
a{color:inherit}

/* ===== アニメーション =====
   ふわっと下から現れる。端末の「視差効果を減らす」設定でも止めない（仕様）。 */
@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes drift{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:translateY(0)}}
.rise{animation:rise .95s var(--ease) both;animation-delay:calc(var(--i,0)*85ms)}
.fade{animation:fade .8s ease both;animation-delay:calc(var(--i,0)*85ms)}

.shell{max-width:520px;margin:auto;padding:max(32px,env(safe-area-inset-top)) 28px 96px}
.brand{display:flex;align-items:baseline;gap:16px;font-size:12px}
.brand-name{font-weight:600;letter-spacing:.18em;margin-right:auto}
#net{color:var(--muted);font-size:11px;letter-spacing:.16em}
.theme-btn{background:none;border:0;padding:4px 0;color:var(--muted);font-size:11px;letter-spacing:.16em;text-transform:uppercase;transition:color .25s}
.theme-btn:hover{color:var(--text)}

.hero{padding:84px 0 28px}
.label{margin:0;font-size:11px;letter-spacing:.32em;color:var(--muted)}
.nick{margin:10px 0 6px;font-size:48px;font-weight:200;line-height:1.25;letter-spacing:-.01em;overflow-wrap:anywhere}
.tagline{margin:12px 0 0;font-size:30px;font-weight:300;line-height:1.55;letter-spacing:.06em;text-wrap:balance}
h1{font-size:15px;font-weight:500;letter-spacing:.14em;margin:0}
.lead{margin:20px 0 0;font-size:13px;color:var(--muted);line-height:2;letter-spacing:.06em}
.mini{font-size:12px;color:var(--muted);line-height:1.9;margin:10px 0 0}.muted{color:var(--muted)}
.status{font-size:12px;min-height:22px;margin:18px 0 0;color:var(--muted)}.status.bad{color:var(--err)}

.primary{display:block;width:100%;border:1px solid var(--ink);border-radius:0;background:var(--ink);color:var(--on-ink);padding:0 20px;min-height:56px;font-size:13px;font-weight:500;letter-spacing:.3em;text-indent:.3em;transition:background .25s,color .25s}
.primary:hover:not(:disabled){background:transparent;color:var(--ink)}
.secondary{display:block;width:100%;background:none;border:0;border-bottom:1px solid var(--line);border-radius:0;text-align:left;padding:16px 0;margin:0;font-size:14px;transition:border-color .25s}
.secondary:hover:not(:disabled){border-bottom-color:var(--text)}
.linkbtn{display:inline-block;background:none;border:0;border-bottom:1px solid var(--line);border-radius:0;padding:2px 0;font-size:12px;letter-spacing:.14em;color:var(--text);text-decoration:none;line-height:1.7;transition:border-color .25s}
.linkbtn:hover:not(:disabled){border-bottom-color:var(--text)}
label{display:block;font-size:11px;color:var(--muted);letter-spacing:.14em}
input.typing{width:100%;background:none;border:0;border-bottom:1px solid var(--text);border-radius:0;color:var(--text);padding:10px 0;font-size:26px;font-weight:300;letter-spacing:.04em;margin:8px 0 6px;transition:border-color .25s}
input.typing.keyin{font-size:15px;letter-spacing:.1em;text-transform:uppercase;font-feature-settings:"tnum"}
form .primary{margin-top:26px}

.sec{margin-top:76px}
.sec-head{display:flex;align-items:baseline;gap:16px;margin:0 0 22px}
.sec-head .label{white-space:nowrap}
.sec-head::after{content:"";flex:1;height:1px;background:var(--line);transform-origin:left;animation:grow 1.2s var(--ease) both;animation-delay:calc(var(--i,0)*85ms + .15s)}

.warn{border-left:1px solid var(--err);padding:6px 0 6px 18px;margin:8px 0 0;color:var(--err);font-size:13px;line-height:1.95}
.warn p{margin:0}.warn .why{margin-top:6px;opacity:.85;font-size:12px}

.keybox{border:1px solid var(--text);padding:28px 22px 22px;background:var(--tint);margin:32px 0 0}
.keybox .label{margin-bottom:14px}
.key{display:block;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:20px;letter-spacing:.16em;line-height:1.9;font-feature-settings:"tnum"}
.keybox .row{display:flex;gap:24px;margin-top:20px}

.site{border-top:1px solid var(--line);padding:22px 0;animation:rise .95s var(--ease) both;animation-delay:calc(var(--i,0)*85ms)}
.site:last-child{border-bottom:1px solid var(--line)}
.site-top{display:flex;justify-content:space-between;align-items:baseline;gap:16px}
.site-name{font-size:15px;letter-spacing:.06em}
.site-num{font-size:36px;font-weight:200;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.2}
.site-num small{font-size:11px;color:var(--muted);letter-spacing:.14em;margin-left:6px;font-weight:400}
.out{color:var(--muted);font-size:13px;letter-spacing:.34em;font-weight:400}
.site.is-out .site-name{color:var(--muted)}
.site-meta{font-size:12px;color:var(--muted);margin:2px 0 0;letter-spacing:.06em;line-height:1.9}
.site-actions{display:flex;gap:26px;margin-top:14px}

.seg{display:flex;margin:10px 0 8px}
.seg button{flex:1;background:none;border:1px solid var(--line);margin-left:-1px;border-radius:0;padding:10px 0;font-size:14px;letter-spacing:.08em;min-height:44px;transition:background .3s,color .3s,border-color .3s}
.seg button:first-child{margin-left:0}
.seg button:hover:not([aria-pressed="true"]){border-color:var(--text);position:relative}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--on-ink);border-color:var(--ink);position:relative}
.stat{display:flex;justify-content:space-between;padding:7px 0;font-size:13px;letter-spacing:.06em}.stat span:last-child{color:var(--muted);font-feature-settings:"tnum"}
.me-block{margin:18px 0 0;animation:fade .7s ease both}
.rank-list{list-style:none;margin:22px 0 0;padding:0;border-top:1px solid var(--text)}
.rank-row{display:flex;align-items:baseline;gap:16px;padding:15px 2px;border-bottom:1px solid var(--line);animation:rise .9s var(--ease) both;animation-delay:calc(var(--i,0)*55ms)}
.rank-no{flex:none;width:42px;font-size:28px;font-weight:200;font-variant-numeric:tabular-nums;color:var(--muted);line-height:1.3}
.rank-row.top .rank-no{color:var(--text)}
.rank-main{flex:1;min-width:0}
.rank-name{font-size:15px;overflow-wrap:anywhere;line-height:1.6}
.rank-sub{display:block;font-size:11px;color:var(--muted);letter-spacing:.06em;margin-top:1px;line-height:1.8}
.rank-n{flex:none;font-size:15px;font-variant-numeric:tabular-nums}
.rank-n small{font-size:11px;color:var(--muted);margin-left:2px}
.rank-row.me{background:var(--tint);padding-left:12px;padding-right:12px;margin:0 -12px}
.chip-me{font-size:10px;letter-spacing:.2em;border:1px solid var(--text);padding:0 6px;margin-left:10px;vertical-align:2px}
.empty{padding:26px 0;color:var(--muted);font-size:13px}

.pane{animation:drift .5s var(--ease) both}
details{border-top:1px solid var(--line);margin-top:30px}
summary{cursor:pointer;padding:18px 0;list-style:none;font-size:14px;letter-spacing:.1em;position:relative}
summary::-webkit-details-marker{display:none}
summary::after,summary::before{content:"";position:absolute;right:2px;top:50%;width:10px;height:1px;background:var(--muted)}
summary::after{transform:rotate(90deg);transition:transform .3s}
details[open]>summary::after{transform:rotate(0)}
details>.pane{padding-bottom:18px}
.nickform{display:flex;gap:22px;align-items:flex-end;margin-top:8px}
.nickform label{flex:1}.nickform input.typing{font-size:22px}
.nickform .linkbtn{margin-bottom:12px}
.note{margin:64px 0 0;color:var(--muted);font-size:11px;line-height:2;letter-spacing:.06em}
.loading{padding:120px 0}
.loading .label{animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
</style>
</head>
<body>
<div class="shell">
  <header class="brand fade"><span class="brand-name" id="brandName">テンシ ポータル</span><span id="net"></span><button class="theme-btn" id="theme" type="button">Dark</button></header>
  <p class="status" id="msg" role="status" aria-live="polite"></p>
  <main id="app"></main>
  <p class="note fade" style="--i:6">ここに保存されるのは、ニックネームと、連携キーと、サイトごとの日別の回答数だけです。<br>回答の中身や、解いた問題の内容は送られません。<br>ニックネームはランキングに表示されます。個人が特定される名前は避けてください。</p>
</div>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
